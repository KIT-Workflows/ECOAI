# Conda environment for P3-Z DFT descriptors (mirrors local optuna_form stack).
#
# Create on the cluster:
#   conda env create -f environment.yml
#   conda activate p3z_dft
#   python -c "import pyscf, dftd3, rdkit; import shutil; assert shutil.which('xtb')"
#
# dftd3-python is installed from conda-forge (not pip) so the cluster does not
# need to compile Fortran/C against the old system GCC (4.8.x).
#
# Versions below match the working local optuna_form env (Jul 2026).
name: p3z_dft
channels:
  - conda-forge
dependencies:
  - python=3.12
  - xtb=6.7.1
  - dftd3-python=1.4.0
  - rdkit=2026.03.3
  - numpy=2.1.3
  - pandas=2.3.1
  - scipy=1.18.0
  - pyarrow=24.0.0
  - matplotlib=3.10.3
  - tqdm=4.67.1
  - pip
  - pip:
      - pyscf==2.13.1
      - h5py==3.13.0
